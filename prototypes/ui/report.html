<!doctype html>
<!-- 一次性 UI 原型第二轮：A 的概览与 B 的三栏分析合并；不是正式报告实现。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'; worker-src blob:">
  <title>Cmetrics / 离线对比报告原型</title>
  <style>@@STYLE@@</style>
</head>
<body>
  <section id="fallback" class="static-fallback">
    <div class="notice"><strong>静态概览 / 模拟数据</strong><p id="init-status">交互未启动，搜索和下钻不可用。</p></div>
    @@STATIC@@
  </section>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  @@READER_ASSETS@@
  <script type="application/json" id="report-data">@@DATA@@</script>
  <script>const PROTOTYPE_MODE = @@PROTOTYPE_MODE@@;
@@SCRIPT@@
  </script>
</body>
</html>
