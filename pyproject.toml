[project]
name = "cmetrics-cmp-viz"
version = "0.1.0"
description = "Cmetrics 度量指标结果对比分析与离线可视化报告生成工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.18.6",
    "polars>=1.0.0",
    "jinja2>=3.1.4",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "syrupy>=4.6.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pre-commit>=4.0.0",
    "psutil>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",      # Pyflakes / Pycodestyle
    "I",                # isort
    "B",                # flake8-bugbear
    "UP",               # pyupgrade (自动升级现代语法)
    "C4",               # flake8-comprehensions
    "SIM",              # flake8-simplify
    "RUF",              # Ruff 专属校验规则
]
ignore = [
    "E501",    # 格式化工具自动处理长行
    "RUF001",  # 允许中文字符串中的标点
    "RUF002",  # 允许中文 Docstring 中的标点
    "RUF003",  # 允许中文注释中的标点
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "prototypes", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
